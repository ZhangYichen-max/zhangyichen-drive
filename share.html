<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件分享 · GUMI Drive</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --green:#10b981;--green-dark:#0d9488;--green-deep:#065f46;
    --mint:#ecfdf5;--mint-2:#d1fae5;--ink:#1f2937;--ink-soft:#4b5563;
    --card:#ffffff;--bg:#f6faf8;--border:#e2e8f0;
    --shadow:0 2px 12px rgba(16,185,129,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.85;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;
    box-shadow:var(--shadow);padding:42px 38px;max-width:420px;width:calc(100% - 32px);text-align:center}
  .icon{font-size:2.6rem}
  h1{font-size:1.25rem;color:var(--green-deep);margin:10px 0 4px}
  .fname{color:var(--ink-soft);font-size:.95rem;word-break:break-all;margin-bottom:22px}
  input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;
    font-size:1rem;text-align:center;letter-spacing:.15em;outline:none}
  input:focus{border-color:var(--green)}
  button{width:100%;margin-top:16px;padding:13px;border:none;border-radius:12px;
    background:var(--green);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:hover{background:var(--green-dark)}
  .err{color:#dc2626;font-size:.85rem;margin-top:12px;min-height:1.2em}
  .hint{color:#9ca3af;font-size:.78rem;margin-top:18px}
  a{color:var(--green-dark)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔗</div>
  <h1>GUMI Drive 文件分享</h1>
  <p class="fname" id="fname">加载中…</p>
  <input id="code" placeholder="请输入提取码" autocomplete="off">
  <button id="go">下载文件</button>
  <p class="err" id="err"></p>
  <p class="hint">提取码由分享者提供 · <a href="/">GUMI Drive</a></p>
</div>
<script>
(function(){
  var path = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  var name = path.split('/').pop() || '未知文件';
  document.getElementById('fname').textContent = name;
  document.title = name + ' · GUMI Drive 分享';

  function fetchJson(f){
    return fetch('/' + f + '?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : {}; })
      .catch(function(){ return {}; });
  }
  document.getElementById('go').onclick = function(){
    var code = document.getElementById('code').value.trim();
    var err = document.getElementById('err');
    err.textContent = '';
    Promise.all([fetchJson('get-code.json'), fetchJson('private-files.json')]).then(function(rs){
      var codes = rs[0] || {}, priv = rs[1] || {};
      if (priv[path] !== undefined){
        var me = localStorage.getItem('gumi_user') || '';
        if (!(me && (me === priv[path] || me === 'Admin'))){
          err.textContent = '该文件是私密文件，无法通过分享链接下载';
          return;
        }
      }
      var need = codes[path];
      if (need === undefined || code === need){
        var a = document.createElement('a');
        a.href = '/' + encodeURI(path);
        a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        err.style.color = '#059669';
        err.textContent = '✓ 提取码正确，开始下载…';
      } else {
        err.style.color = '#dc2626';
        err.textContent = '提取码不正确';
      }
    });
  };
  document.getElementById('code').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('go').click();
  });
})();
</script>
</body>
</html>
